# BTC Monitor Configuration

# Twitter/X API
twitter:
  consumer_key: ""
  consumer_secret: ""
  access_token: ""
  access_token_secret: ""
  bearer_token: ""

# News API
news:
  api_key: ""  # NewsAPI.org key (optional)
  max_articles: 50
  hours_back: 24

# Database
database:
  url: "sqlite:///btc_monitor.db"

# Data sources
data_sources:
  update_interval: 300  # seconds
  symbols:
    - "BTC-USD"

# Analysis
analysis:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  moving_averages:
    - 20
    - 50
    - 200

# Logging
logging:
  level: "INFO"
  file: "btc_monitor.log"
